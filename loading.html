<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>consistency.ink — booting…</title>

  <link rel="stylesheet" href="assets/loader.css" />

  <style>
    /* ============================================================
       INTRO BOOT SEQUENCE
       0.00s -> bg starts fading in (1.75s fade)
       ~1.00s -> logo + boot UI start fading in
       Timing, the 4:3 crop, and the CRT overlay/flash transition
       are all owned by the parent page (index.html/js/css) now —
       this iframe just renders the content that sits inside them.
       ============================================================ */

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Tahoma', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .boot-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* -----------------------------------------------------------
       LAYER 1 — crimsonsky background, fading in from black
       ----------------------------------------------------------- */
    .bg-frame-wrap {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: bgFadeIn 1.75s ease-out forwards;
    }

    .bg-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      pointer-events: none;
    }

    @keyframes bgFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* -----------------------------------------------------------
       LAYER 2 — boot UI (logo + loading bar), fading in on top,
       everything gets a subtle black glow so it reads clearly
       against the crimson gradient underneath.
       ----------------------------------------------------------- */
    .boot-ui {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      opacity: 0;
      animation: uiFadeIn 1.4s ease-out forwards;
      animation-delay: 1s;
    }

    @keyframes uiFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .boot-logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .boot-logo-block img {
      width: 155px;
      height: 155px;
      filter:
        drop-shadow(0 0 6px rgba(0,0,0,0.85))
        drop-shadow(0 0 18px rgba(0,0,0,0.65))
        drop-shadow(0 2px 4px rgba(0,0,0,0.9));
    }

    .boot-lockup {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .boot-lockup .text-block {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-size: 26px;
      letter-spacing: 0.5px;
    }

    .boot-lockup .ms {
      color: #f4f4f4;
      font-weight: 400;
      text-shadow:
        0 0 4px rgba(0,0,0,0.9),
        0 0 14px rgba(0,0,0,0.8),
        0 1px 2px rgba(0,0,0,0.95);
    }

    .boot-lockup .win {
      color: #ffffff;
      font-weight: 700;
      text-shadow:
        0 0 4px rgba(0,0,0,0.9),
        0 0 14px rgba(0,0,0,0.8),
        0 1px 2px rgba(0,0,0,0.95);
    }

    .boot-lockup .ver {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      align-self: flex-end;
      text-shadow: 0 0 6px rgba(0,0,0,0.9);
    }

    /* Classic XP-style marching loading bar */
    .boot-loader {
      width: 160px;
      height: 12px;
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      background: rgba(0,0,0,0.35);
      filter: drop-shadow(0 0 8px rgba(0,0,0,0.85));
    }

    .boot-loader .chunk {
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 22px;
      border-radius: 2px;
      background: linear-gradient(180deg, #eaf3ff 0%, #7fb2ff 45%, #2f6fd6 100%);
      box-shadow: 0 0 5px rgba(0,0,0,0.6);
      animation: chunkMarch 1.4s linear infinite;
    }
    .boot-loader .chunk:nth-child(1) { animation-delay: 0s; }
    .boot-loader .chunk:nth-child(2) { animation-delay: 0.35s; }
    .boot-loader .chunk:nth-child(3) { animation-delay: 0.7s; }

    @keyframes chunkMarch {
      0%   { left: -24px; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { left: 162px; opacity: 0; }
    }

    .boot-status {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.3px;
      text-shadow:
        0 0 4px rgba(0,0,0,0.9),
        0 0 12px rgba(0,0,0,0.75),
        0 1px 2px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>

  <div class="boot-stage" id="boot-stage">

    <!-- Layer 1: crimsonsky background -->
    <div class="bg-frame-wrap">
      <iframe src="crimsonsky.html" title="" tabindex="-1"></iframe>
    </div>

    <!-- Layer 2: boot UI -->
    <div class="boot-ui">
      <div class="boot-logo-block">
        <img src="assets/logo.svg" alt="" />
        <div class="boot-lockup">
          <div class="text-block">
            <span class="ms">consistency.ink</span>
            <span class="win">Online Gallery</span>
          </div>
          <span class="ver">2.0</span>
        </div>
      </div>

      <div class="boot-loader">
        <div class="chunk"></div>
        <div class="chunk"></div>
        <div class="chunk"></div>
      </div>

      <p class="boot-status">Loading personal settings…</p>
    </div>

  </div>

  <footer class="meta">
    <div class="copy">Free Use/Parody, Original Copyright belongs to Microsoft ®</div>
    <div class="title">Portfolio Updated 09-15-2026</div>
  </footer>

  <script src="assets/loader.js" defer></script>
</body>
</html>
