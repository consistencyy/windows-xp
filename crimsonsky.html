<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crimson Twilight Parallax Drive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0005;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Animated Looping Background Gradient */
    .sky {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        #0a0014 0%,
        #1a0009 11%,
        #350010 24%,
        #5c0018 38%,
        #8f0022 52%,
        #c30d28 66%,
        #ef1f24 80%,
        #ff5a1a 92%,
        #ff8a2e 100%
      );
      background-size: 100% 220%;
      animation: skyGradientPulse 11s ease-in-out infinite alternate;
    }

    /* Warm glow hugging the horizon, layered between the sky and the stars */
    .horizon-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150%;
      height: 42%;
      background: radial-gradient(
        ellipse at 50% 100%,
        rgba(255, 170, 90, 0.55) 0%,
        rgba(255, 90, 60, 0.28) 35%,
        rgba(255, 60, 60, 0) 72%
      );
      animation: horizonPulse 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes horizonPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    @keyframes skyGradientPulse {
      0% {
        background-position: 0% 0%;
        filter: brightness(0.92) saturate(1.05);
      }
      50% {
        background-position: 0% 55%;
        filter: brightness(1.12) saturate(1.28);
      }
      100% {
        background-position: 0% 100%;
        filter: brightness(1.3) saturate(1.4);
      }
    }

    /* Starfield Canvas Layer */
    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Parallax Scrolling Tracks (Translating Smoothly to the Right) */
    .parallax-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100%;
      will-change: transform;
    }

    .silhouette-svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .black-fill { fill: #050002; }
    .black-stroke { 
      stroke: #050002; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
    }

    /* PARALLAX SPEED LAYERS (Infinite Smooth Looping Right) */
    /* Distant Transmission Towers & High Power Lines */
    .layer-far {
      animation: moveRight 23.4s linear infinite;
    }

    /* Midground Utility Poles & Secondary Lines */
    .layer-mid {
      animation: moveRight 15s linear infinite;
    }

    /* Foreground Trees & Silhouettes */
    .layer-near {
      animation: moveRight 8.4s linear infinite;
    }

    /* Closest Foreground: Highway Barrier & Mile Markers (zooms by fast) */
    .layer-foreground {
      animation: moveRight 0.525s linear infinite;
    }

    @keyframes moveRight {
      0% {
        transform: translateX(-50%);
      }
      100% {
        transform: translateX(0%);
      }
    }

    /* Aviation obstruction lights on the transmission tower tops */
    .beacon-core {
      fill: #ff3333;
      animation: beaconBlink 1.3s infinite;
    }
    .beacon-glow {
      fill: #ff2b2b;
      animation: beaconBlinkGlow 1.3s infinite;
    }
    @keyframes beaconBlink {
      0%, 50% { opacity: 1; }
      53%, 100% { opacity: 0.12; }
    }
    @keyframes beaconBlinkGlow {
      0%, 50% { opacity: 0.45; }
      53%, 100% { opacity: 0.06; }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <!-- Animated Sky Layer -->
    <div class="sky"></div>

    <!-- Warm Horizon Glow -->
    <div class="horizon-glow"></div>

    <!-- Twinkling & Drifting Stars Layer -->
    <canvas id="starfield"></canvas>

    <!-- LAYER 1: Distant Parallax (Transmission Tower) -->
    <div class="parallax-track layer-far">
      <svg class="silhouette-svg" viewBox="0 0 2400 675" preserveAspectRatio="none">
        <!-- Repeating Unit 1 & Unit 2 for seamless loop -->
        <g class="black-stroke black-fill">
          <!-- Tower A (x=400) -->
          <g transform="translate(400, 0)">
            <polygon points="0,120 -7,170 7,170" stroke-width="2"/>
            <line x1="0" y1="100" x2="0" y2="120" stroke-width="2"/>
            <circle class="beacon-glow" cx="0" cy="97" r="4"/>
            <circle class="beacon-core" cx="0" cy="97" r="1.4"/>
            <line x1="-7" y1="170" x2="-70" y2="675" stroke-width="4"/>
            <line x1="7" y1="170" x2="70" y2="675" stroke-width="4"/>
            <line x1="-9" y1="200" x2="9" y2="200" stroke-width="2.5"/>
            <line x1="-16" y1="250" x2="16" y2="250" stroke-width="3"/>
            <line x1="-24" y1="310" x2="24" y2="310" stroke-width="3"/>
            <line x1="-35" y1="390" x2="35" y2="390" stroke-width="3.5"/>
            <line x1="-48" y1="480" x2="48" y2="480" stroke-width="4"/>
            <line x1="-62" y1="580" x2="62" y2="580" stroke-width="4"/>

            <!-- Bracing -->
            <line x1="-7" y1="170" x2="9" y2="200" stroke-width="1.5"/>
            <line x1="7" y1="170" x2="-9" y2="200" stroke-width="1.5"/>
            <line x1="-16" y1="250" x2="24" y2="310" stroke-width="2"/>
            <line x1="16" y1="250" x2="-24" y2="310" stroke-width="2"/>
            <line x1="-24" y1="310" x2="35" y2="390" stroke-width="2"/>
            <line x1="24" y1="310" x2="-35" y2="390" stroke-width="2"/>
            <line x1="-35" y1="390" x2="48" y2="480" stroke-width="2"/>
            <line x1="35" y1="390" x2="-48" y2="480" stroke-width="2"/>

            <!-- Arms -->
            <line x1="-80" y1="250" x2="80" y2="250" stroke-width="4"/>
            <line x1="-140" y1="390" x2="140" y2="390" stroke-width="5"/>
            <line x1="-170" y1="530" x2="170" y2="530" stroke-width="5"/>
          </g>

          <!-- Tower B (Duplicate at x=1600 for tile seamlessness) -->
          <g transform="translate(1600, 0)">
            <polygon points="0,120 -7,170 7,170" stroke-width="2"/>
            <line x1="0" y1="100" x2="0" y2="120" stroke-width="2"/>
            <circle class="beacon-glow" cx="0" cy="97" r="4"/>
            <circle class="beacon-core" cx="0" cy="97" r="1.4"/>
            <line x1="-7" y1="170" x2="-70" y2="675" stroke-width="4"/>
            <line x1="7" y1="170" x2="70" y2="675" stroke-width="4"/>
            <line x1="-9" y1="200" x2="9" y2="200" stroke-width="2.5"/>
            <line x1="-16" y1="250" x2="16" y2="250" stroke-width="3"/>
            <line x1="-24" y1="310" x2="24" y2="310" stroke-width="3"/>
            <line x1="-35" y1="390" x2="35" y2="390" stroke-width="3.5"/>
            <line x1="-48" y1="480" x2="48" y2="480" stroke-width="4"/>
            <line x1="-62" y1="580" x2="62" y2="580" stroke-width="4"/>

            <line x1="-7" y1="170" x2="9" y2="200" stroke-width="1.5"/>
            <line x1="7" y1="170" x2="-9" y2="200" stroke-width="1.5"/>
            <line x1="-16" y1="250" x2="24" y2="310" stroke-width="2"/>
            <line x1="16" y1="250" x2="-24" y2="310" stroke-width="2"/>
            <line x1="-24" y1="310" x2="35" y2="390" stroke-width="2"/>
            <line x1="24" y1="310" x2="-35" y2="390" stroke-width="2"/>
            <line x1="-35" y1="390" x2="48" y2="480" stroke-width="2"/>
            <line x1="35" y1="390" x2="-48" y2="480" stroke-width="2"/>

            <line x1="-80" y1="250" x2="80" y2="250" stroke-width="4"/>
            <line x1="-140" y1="390" x2="140" y2="390" stroke-width="5"/>
            <line x1="-170" y1="530" x2="170" y2="530" stroke-width="5"/>
          </g>
        </g>

        <!-- High Voltage Power Lines -->
        <!-- Each wire begins exactly at the end of a cross-arm (the tips of the T) -->
        <!-- and sags toward the matching arm-end on the neighboring tower. -->
        <!-- Curves are written past x=0/x=2400 on purpose and let the SVG viewport -->
        <!-- clip them; this keeps every repeating segment an EXACT +1200 shift of -->
        <!-- the last (no manually-truncated endpoints), which is what makes the -->
        <!-- loop restart invisible. -->
        <g class="black-stroke" fill="none" stroke-width="1.6" opacity="0.85">
          <!-- Top arm (y=250, arm ends at towerX -80 / +80) -->
          <path d="M -720 250 Q -200 325 320 250 M 480 250 Q 1000 325 1520 250 M 1680 250 Q 2200 325 2720 250"/>
          <!-- Mid arm (y=390, arm ends at towerX -140 / +140) -->
          <path d="M -660 390 Q -200 490 260 390 M 540 390 Q 1000 490 1460 390 M 1740 390 Q 2200 490 2660 390"/>
          <!-- Lower arm (y=530, arm ends at towerX -170 / +170) -->
          <path d="M -630 530 Q -200 655 230 530 M 570 530 Q 1000 655 1430 530 M 1770 530 Q 2200 655 2630 530"/>
        </g>
      </svg>
    </div>

    <!-- LAYER 2: Midground Parallax (Utility Poles) -->
    <div class="parallax-track layer-mid">
      <svg class="silhouette-svg" viewBox="0 0 2400 675" preserveAspectRatio="none">
        <!-- Pole styles alternate Normal / Leaning within each 1200-unit tile so -->
        <!-- the loop still repeats seamlessly while giving visual variety. -->

        <!-- Normal Pole (x=800) -->
        <g class="black-stroke black-fill" transform="translate(800, 0)">
          <line x1="0" y1="400" x2="-5" y2="675" stroke-width="9"/>
          <!-- Crossbar 1 (upper) -->
          <line x1="-80" y1="430" x2="60" y2="422" stroke-width="5"/>
          <line x1="-40" y1="450" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="30" y1="447" x2="-3" y2="430" stroke-width="2.5"/>
          <!-- Crossbar 2 (lower) -->
          <line x1="-80" y1="505" x2="60" y2="497" stroke-width="5"/>
          <line x1="-40" y1="525" x2="-3" y2="505" stroke-width="2.5"/>
          <line x1="30" y1="522" x2="-3" y2="505" stroke-width="2.5"/>
          <!-- Transformer boxes, enlarged, both sides -->
          <rect x="6" y="560" width="22" height="40" rx="3"/>
          <rect x="-24" y="572" width="22" height="40" rx="3"/>
        </g>

        <!-- Leaning Pole (x=300) - tilted 6 degrees for variety -->
        <g class="black-stroke black-fill" transform="translate(300, 0) rotate(6, 0, 675)">
          <line x1="0" y1="400" x2="-5" y2="675" stroke-width="9"/>
          <line x1="-80" y1="430" x2="60" y2="422" stroke-width="5"/>
          <line x1="-40" y1="450" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="30" y1="447" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="-80" y1="505" x2="60" y2="497" stroke-width="5"/>
          <line x1="-40" y1="525" x2="-3" y2="505" stroke-width="2.5"/>
          <line x1="30" y1="522" x2="-3" y2="505" stroke-width="2.5"/>
          <rect x="6" y="560" width="22" height="40" rx="3"/>
          <rect x="-24" y="572" width="22" height="40" rx="3"/>
        </g>

        <!-- Normal Pole (Duplicate at x=2000) -->
        <g class="black-stroke black-fill" transform="translate(2000, 0)">
          <line x1="0" y1="400" x2="-5" y2="675" stroke-width="9"/>
          <line x1="-80" y1="430" x2="60" y2="422" stroke-width="5"/>
          <line x1="-40" y1="450" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="30" y1="447" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="-80" y1="505" x2="60" y2="497" stroke-width="5"/>
          <line x1="-40" y1="525" x2="-3" y2="505" stroke-width="2.5"/>
          <line x1="30" y1="522" x2="-3" y2="505" stroke-width="2.5"/>
          <rect x="6" y="560" width="22" height="40" rx="3"/>
          <rect x="-24" y="572" width="22" height="40" rx="3"/>
        </g>

        <!-- Leaning Pole (Duplicate at x=1500) -->
        <g class="black-stroke black-fill" transform="translate(1500, 0) rotate(6, 0, 675)">
          <line x1="0" y1="400" x2="-5" y2="675" stroke-width="9"/>
          <line x1="-80" y1="430" x2="60" y2="422" stroke-width="5"/>
          <line x1="-40" y1="450" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="30" y1="447" x2="-3" y2="430" stroke-width="2.5"/>
          <line x1="-80" y1="505" x2="60" y2="497" stroke-width="5"/>
          <line x1="-40" y1="525" x2="-3" y2="505" stroke-width="2.5"/>
          <line x1="30" y1="522" x2="-3" y2="505" stroke-width="2.5"/>
          <rect x="6" y="560" width="22" height="40" rx="3"/>
          <rect x="-24" y="572" width="22" height="40" rx="3"/>
        </g>

        <!-- Upper Crossbar Lines -->
        <!-- Normal tips: left=(poleX-80,430) right=(poleX+60,422). -->
        <!-- Leaning tips are the same points pre-rotated 6 degrees around the -->
        <!-- pole's own base (0,675), matching the rotate() on the leaning poles -->
        <!-- above exactly: left=(poleX-53.95,422.98) right=(poleX+86.12,429.66). -->
        <g class="black-stroke" fill="none" stroke-width="1.4" opacity="0.9">
          <path d="M -340 422 Q -47 478 246.05 422.98 M 386.12 429.66 Q 553 478 720 430 M 860 422 Q 1153 478 1446.05 422.98 M 1586.12 429.66 Q 1753 478 1920 430 M 2060 422 Q 2353 478 2646.05 422.98"/>
          <path d="M -340 422 Q -47 500 246.05 422.98 M 386.12 429.66 Q 553 500 720 430 M 860 422 Q 1153 500 1446.05 422.98 M 1586.12 429.66 Q 1753 500 1920 430 M 2060 422 Q 2353 500 2646.05 422.98"/>
        </g>

        <!-- Lower Crossbar Lines -->
        <!-- Normal tips: left=(poleX-80,505) right=(poleX+60,497). -->
        <!-- Leaning tips (same 6 degree rotation): left=(poleX-61.79,497.57) -->
        <!-- right=(poleX+78.28,504.25). -->
        <g class="black-stroke" fill="none" stroke-width="1.1" opacity="0.85">
          <path d="M -340 497 Q -51 555 238.21 497.57 M 378.28 504.25 Q 549 555 720 505 M 860 497 Q 1149 555 1438.21 497.57 M 1578.28 504.25 Q 1749 555 1920 505 M 2060 497 Q 2349 555 2638.21 497.57"/>
          <path d="M -340 497 Q -51 580 238.21 497.57 M 378.28 504.25 Q 549 580 720 505 M 860 497 Q 1149 580 1438.21 497.57 M 1578.28 504.25 Q 1749 580 1920 505 M 2060 497 Q 2349 580 2638.21 497.57"/>
        </g>
      </svg>
    </div>

    <!-- LAYER 3: Foreground Parallax (Trees & Roadside Elements) -->
    <div class="parallax-track layer-near">
      <svg class="silhouette-svg" viewBox="0 0 2400 675" preserveAspectRatio="none">
        <g class="black-fill">
          <!-- Tree Group A (x=900..1200) - fully curved silhouette, no straight edges -->
          <path d="M 905 675 C 888 636, 892 594, 928 562 C 946 546, 968 552, 984 528 C 1002 502, 1038 490, 1062 512 C 1080 478, 1128 462, 1160 492 C 1184 514, 1188 548, 1172 574 C 1194 588, 1204 616, 1198 645 C 1196 656, 1198 666, 1200 675 C 1160 686, 1112 682, 1060 678 C 1010 684, 955 686, 905 675 Z"/>
          <circle cx="950" cy="548" r="19"/>
          <circle cx="1010" cy="505" r="21"/>
          <circle cx="1075" cy="478" r="25"/>
          <circle cx="1135" cy="498" r="20"/>
          <circle cx="1165" cy="530" r="17"/>

          <!-- Tree Group B (Duplicate of A at +1200) -->
          <path d="M 2105 675 C 2088 636, 2092 594, 2128 562 C 2146 546, 2168 552, 2184 528 C 2202 502, 2238 490, 2262 512 C 2280 478, 2328 462, 2360 492 C 2384 514, 2388 548, 2372 574 C 2394 588, 2404 616, 2398 645 C 2396 656, 2398 666, 2400 675 C 2360 686, 2312 682, 2260 678 C 2210 684, 2155 686, 2105 675 Z"/>
          <circle cx="2150" cy="548" r="19"/>
          <circle cx="2210" cy="505" r="21"/>
          <circle cx="2275" cy="478" r="25"/>
          <circle cx="2335" cy="498" r="20"/>
          <circle cx="2365" cy="530" r="17"/>

          <!-- Tree Group C (new, smaller cluster around x=580..750) -->
          <path d="M 555 675 C 542 644, 548 612, 578 592 C 596 580, 616 588, 630 570 C 646 550, 674 546, 690 566 C 706 548, 732 546, 746 566 C 758 582, 754 606, 740 620 C 736 640, 740 660, 742 675 C 712 682, 678 680, 645 677 C 615 682, 583 682, 555 675 Z"/>
          <circle cx="605" cy="588" r="14"/>
          <circle cx="660" cy="560" r="17"/>
          <circle cx="712" cy="572" r="14"/>

          <!-- Tree Group D (Duplicate of C at +1200) -->
          <path d="M 1755 675 C 1742 644, 1748 612, 1778 592 C 1796 580, 1816 588, 1830 570 C 1846 550, 1874 546, 1890 566 C 1906 548, 1932 546, 1946 566 C 1958 582, 1954 606, 1940 620 C 1936 640, 1940 660, 1942 675 C 1912 682, 1878 680, 1845 677 C 1815 682, 1783 682, 1755 675 Z"/>
          <circle cx="1805" cy="588" r="14"/>
          <circle cx="1860" cy="560" r="17"/>
          <circle cx="1912" cy="572" r="14"/>

          <!-- Small shrubs scattered across bottom -->
          <path d="M 0 675 C 14 646, 40 636, 62 644 C 78 636, 98 644, 90 675 Z"/>
          <path d="M 450 675 C 464 650, 496 642, 516 652 C 528 646, 546 652, 540 675 Z"/>
          <path d="M 1200 675 C 1214 646, 1240 636, 1262 644 C 1278 636, 1298 644, 1290 675 Z"/>
          <path d="M 1650 675 C 1664 650, 1696 642, 1716 652 C 1728 646, 1746 652, 1740 675 Z"/>
          <path d="M 800 675 C 812 652, 838 644, 856 652 C 870 646, 886 652, 880 675 Z"/>
          <path d="M 2000 675 C 2012 652, 2038 644, 2056 652 C 2070 646, 2086 652, 2080 675 Z"/>

          <!-- Extra shrubs for denser foliage (3 new matched +1200 pairs) -->
          <path d="M 150 675 C 164 646, 190 636, 212 644 C 228 636, 248 644, 240 675 Z"/>
          <path d="M 1350 675 C 1364 646, 1390 636, 1412 644 C 1428 636, 1448 644, 1440 675 Z"/>
          <path d="M 600 675 C 614 646, 640 636, 662 644 C 678 636, 698 644, 690 675 Z"/>
          <path d="M 1800 675 C 1814 646, 1840 636, 1862 644 C 1878 636, 1898 644, 1890 675 Z"/>
          <path d="M 1050 675 C 1064 646, 1090 636, 1112 644 C 1128 636, 1148 644, 1140 675 Z"/>
          <path d="M 2250 675 C 2264 646, 2290 636, 2312 644 C 2328 636, 2348 644, 2340 675 Z"/>

          <!-- Continuous grass-tuft fringe along the very bottom edge. -->
          <!-- Built from 30 bumps (40 units each = 1200 total), then the -->
          <!-- exact same 30 heights repeated for the second tile, so the -->
          <!-- pattern is periodic by construction rather than by luck. -->
          <path d="M 0 675 Q 20 657.8 40 675 Q 60 659.5 80 675 Q 100 654.5 120 675 Q 140 660.3 160 675 Q 180 655.6 200 675 Q 220 657.3 240 675 Q 260 660.4 280 675 Q 300 655.9 320 675 Q 340 660.6 360 675 Q 380 656.7 400 675 Q 420 660.3 440 675 Q 460 660.1 480 675 Q 500 656.8 520 675 Q 540 652.7 560 675 Q 580 659.8 600 675 Q 620 658.8 640 675 Q 660 654.7 680 675 Q 700 651.5 720 675 Q 740 655.2 760 675 Q 780 657.0 800 675 Q 820 651.2 840 675 Q 860 660.5 880 675 Q 900 652.4 920 675 Q 940 658.1 960 675 Q 980 659.6 1000 675 Q 1020 659.8 1040 675 Q 1060 657.9 1080 675 Q 1100 652.8 1120 675 Q 1140 659.2 1160 675 Q 1180 655.2 1200 675 Q 1220 657.8 1240 675 Q 1260 659.5 1280 675 Q 1300 654.5 1320 675 Q 1340 660.3 1360 675 Q 1380 655.6 1400 675 Q 1420 657.3 1440 675 Q 1460 660.4 1480 675 Q 1500 655.9 1520 675 Q 1540 660.6 1560 675 Q 1580 656.7 1600 675 Q 1620 660.3 1640 675 Q 1660 660.1 1680 675 Q 1700 656.8 1720 675 Q 1740 652.7 1760 675 Q 1780 659.8 1800 675 Q 1820 658.8 1840 675 Q 1860 654.7 1880 675 Q 1900 651.5 1920 675 Q 1940 655.2 1960 675 Q 1980 657.0 2000 675 Q 2020 651.2 2040 675 Q 2060 660.5 2080 675 Q 2100 652.4 2120 675 Q 2140 658.1 2160 675 Q 2180 659.6 2200 675 Q 2220 659.8 2240 675 Q 2260 657.9 2280 675 Q 2300 652.8 2320 675 Q 2340 659.2 2360 675 Q 2380 655.2 2400 675 Z"/>
        </g>
      </svg>
    </div>

    <!-- LAYER 4: Closest Foreground (Highway Barrier & Mile Markers) -->
    <div class="parallax-track layer-foreground">
      <svg class="silhouette-svg" viewBox="0 0 2400 675" preserveAspectRatio="none">
        <defs>
          <linearGradient id="markerTrail" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffcf8a" stop-opacity="0"/>
            <stop offset="100%" stop-color="#ffcf8a" stop-opacity="0.55"/>
          </linearGradient>
          <!-- Horizontal-only blur (x blur, no y blur) so it reads as speed, not fog -->
          <filter id="motionBlur" x="-20%" width="140%" y="-20%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4 0"/>
          </filter>
        </defs>

        <g filter="url(#motionBlur)">
        <!-- Guardrail beam, spans full width (trivially periodic) -->
        <g class="black-fill">
          <rect x="0" y="580" width="2400" height="14" rx="3"/>
        </g>
        <rect x="0" y="580" width="2400" height="3" fill="rgba(255,190,150,0.35)"/>

        <!-- Reflector studs along the rail, every 150 units -->
        <g fill="#ffcf7a" opacity="0.8">
          <circle cx="0" cy="587" r="3"/>
          <circle cx="150" cy="587" r="3"/>
          <circle cx="300" cy="587" r="3"/>
          <circle cx="450" cy="587" r="3"/>
          <circle cx="600" cy="587" r="3"/>
          <circle cx="750" cy="587" r="3"/>
          <circle cx="900" cy="587" r="3"/>
          <circle cx="1050" cy="587" r="3"/>
          <circle cx="1200" cy="587" r="3"/>
          <circle cx="1350" cy="587" r="3"/>
          <circle cx="1500" cy="587" r="3"/>
          <circle cx="1650" cy="587" r="3"/>
          <circle cx="1800" cy="587" r="3"/>
          <circle cx="1950" cy="587" r="3"/>
          <circle cx="2100" cy="587" r="3"/>

  <!-- Interactive Dynamic Starfield Script -->
  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let width, height;
    let stars = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initStars();
    }

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * (height * 0.75);
        this.size = Math.random() * 1.6 + 0.35;
        this.baseAlpha = Math.random() * 0.6 + 0.35;
        this.alpha = this.baseAlpha;
        this.twinkleSpeed = Math.random() * 0.07 + 0.015;
        this.twinkleAngle = Math.random() * Math.PI * 2;
        // A slower secondary flicker layered on top for a less mechanical glimmer
        this.flickerSpeed = Math.random() * 0.02 + 0.004;
        this.flickerAngle = Math.random() * Math.PI * 2;
        // How strongly this particular star fringes with color (varies per star)
        this.aberrationStrength = Math.random() * 0.8 + 0.4;
        // Subtle rightward drift for stars
        this.speedX = Math.random() * 0.15 + 0.05;
      }

      update() {
        // Twinkle effect: a fast primary sparkle plus a slower breathing layer
        this.twinkleAngle += this.twinkleSpeed;
        this.flickerAngle += this.flickerSpeed;
        const sparkle = Math.sin(this.twinkleAngle) * 0.4;
        const breathe = Math.sin(this.flickerAngle) * 0.2;
        this.alpha = this.baseAlpha + sparkle + breathe;
        if (this.alpha < 0) this.alpha = 0;
        if (this.alpha > 1) this.alpha = 1;

        // Slow rightward drift to match car motion perspective
        this.x += this.speedX;
        if (this.x > width) {
          this.x = 0;
          this.y = Math.random() * (height * 0.75);
        }
      }

      draw(globalAberration) {
        const offset = globalAberration * this.aberrationStrength;
        if (offset > 0.15) {
          // Slight animated RGB fringing, most visible on brighter stars
          ctx.fillStyle = `rgba(255, 70, 70, ${this.alpha * 0.5})`;
          ctx.beginPath();
          ctx.arc(this.x - offset, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = `rgba(80, 140, 255, ${this.alpha * 0.5})`;
          ctx.beginPath();
          ctx.arc(this.x + offset, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = `rgba(255, 225, 235, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 6000);
      for (let i = 0; i < count; i++) {
        stars.push(new Star());
      }
    }

    let aberrationTime = 0;

    function animate() {
      ctx.clearRect(0, 0, width, height);
      // Slowly oscillating global aberration amount, so the color fringing
      // itself gently pulses in and out rather than sitting static.
      aberrationTime += 0.012;
      const globalAberration = 0.5 + Math.sin(aberrationTime) * 0.45;

      stars.forEach(star => {
        star.update();
        star.draw(globalAberration);
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();
  </script>
